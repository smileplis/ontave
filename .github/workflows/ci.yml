name: Verify Ontave alpha
on: [push, pull_request]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --cache .cache/npm
      - run: npm test
      - run: npm run test:integration
      - run: npm run verify:domains
      - run: npm run measure:benefits
      - run: node scripts/verify-public.mjs
      - run: npm run verify:package
      - run: npm run verify:playground
      - run: npm run verify:node
      - run: node scripts/verify-next.mjs
  website:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm ci --prefix examples/read-only-agent --ignore-scripts
      - run: npm run check --prefix examples/read-only-agent
      - run: npm test --prefix examples/read-only-agent
